name: CI 

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  helm-validation:
    if: "!startsWith(github.event.head_commit.message, 'chore(gitops):')"
    name: Helm Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Setup Kubeconform
        uses: bmuschko/setup-kubeconform@v1
        with:
          kubeconform-version: '0.6.7'

      - name: Validate Helm and Kubernetes Manifests
        run: make -f Makefile.helm helm-validate
